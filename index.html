<!-- index.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Glass Music Player</title>

    <link rel="icon"
    href="images/cover1.jpg">

    <link rel="stylesheet"
    href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- Background Glow -->

    <div class="bg1"></div>
    <div class="bg2"></div>

    <div class="container">

        <!-- Playlist -->

        <div class="playlist">

            <h2>Playlist</h2>

            <input type="text"
            id="search"
            placeholder="Search songs...">

            <!-- Song 1 -->

            <div class="song active">

                <img src="images/cover1.jpg">

                <div>

                    <h4>song 1</h4>
                    <p>Artist</p>

                </div>

            </div>

            <!-- Song 2 -->

            <div class="song">

                <img src="images/cover2.jpg">

                <div>

                    <h4>song 2</h4>
                    <p>Artist</p>

                </div>

            </div>

        </div>

        <!-- Music Player -->

        <div class="music-player">

            <img src="images/cover1.jpg"
            class="cover"
            id="cover">

            <h1 id="title">song 1</h1>

            <p id="artist">Artist</p>

            <!-- Progress -->

            <input type="range"
            value="0"
            id="progress">

            <div class="time">

                <span id="current">0:00</span>

                <span id="duration">0:00</span>

            </div>

            <!-- Controls -->

            <div class="controls">

                <button id="prev">

                    <i class="fa-solid fa-backward"></i>

                </button>

                <button id="play">

                    <i class="fa-solid fa-play"></i>

                </button>

                <button id="next">

                    <i class="fa-solid fa-forward"></i>

                </button>

            </div>

            <!-- Music Wave -->

            <div class="wave">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

            <!-- Volume -->

            <div class="volume-container">

                <i class="fa-solid fa-volume-high"></i>

                <input type="range"
                min="0"
                max="1"
                step="0.1"
                value="1"
                id="volume">

            </div>

        </div>

    </div>

    <audio id="audio"></audio>

    <script src="script.js"></script>

</body>

</html>
